name: Deploy blog to Timeweb

# Быстрый deploy только при изменениях блога (Excalibur syndicate react).
on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "public/blog-assets/**"
      - "src/generated/**"
      - "scripts/generate-blog-manifest.mjs"
      - "scripts/blog-routes.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-timeweb-blog
  cancel-in-progress: true

jobs:
  build-and-deploy-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://www.morozovanatalia.ru' }}
          SKIP_PRERENDER: "1"
        run: npm run build

      - name: Deploy to Timeweb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}

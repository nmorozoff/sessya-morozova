name: Deploy to Timeweb (disabled)

# Автодеплой отключён: Actions на приватном репо упирается в биллинг,
# prerender надёжнее локально. Excalibur/Cursor пушат только код в main.
#
# Деплой на Timeweb с вашего Mac:
#   npm run deploy          — сборка + FTP
#   npm run deploy:upload   — только FTP (если dist/ уже собран)
#
# Нужен .ftp-deploy.env (см. .ftp-deploy.env.example)

on:
  workflow_dispatch:

jobs:
  local-deploy-only:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Деплой локально — npm run deploy"
